const SPEC_AA_SCREEN_VARIANCE: f32 = 0.25; // screen-space sampling variance (σ²)
const SPEC_AA_MAX_KERNEL:      f32 = 0.18; // clamp on the added roughness² (κ)

fn geometric_specular_aa(roughness: f32, N: vec3<f32>) -> f32 {
  let dndu     = dpdx(N);
  let dndv     = dpdy(N);
  let variance = SPEC_AA_SCREEN_VARIANCE * (dot(dndu, dndu) + dot(dndv, dndv));
  let kernel   = min(2.0 * variance, SPEC_AA_MAX_KERNEL);
  let r2       = roughness * roughness;
  return sqrt(clamp(r2 + kernel, 0.0, 1.0));
}

// glTF PBR extension lobes (clearcoat / sheen / iridescence / diffuse
// transmission) + the MaterialParams struct, shared with the deferred path.
// Shared glTF PBR extension shading — clearcoat, sheen, iridescence, and diffuse
// transmission (KHR_materials_clearcoat / _sheen / _iridescence /
// _diffuse_transmission). One source of truth for the extended per-material
// params layout and the DIRECT (punctual / sun) lobes, used by the point/spot,
// forward, and forward+ lighting paths so they match the deferred path.
//
// The deferred pass (deferred_lighting.wgsl) keeps its own inline copy of this
// math (interleaved with its probe/IBL code); keep the lobe math here in sync
// with it. The struct layout below MUST match material_params_table.ts and the
// inline \`MaterialParams\` struct in deferred_lighting.wgsl (20 f32, stride 80).
//
// Depends on pbr_brdf.wgsl for PI, the GGX D/V/F terms, and energy_compensation
// — the importing shader must \`#import "pbr_brdf.wgsl"\` as well. Pulls in
// iridescence.wgsl for the thin-film F0; do NOT also \`#import "iridescence.wgsl"\`
// in a shader that imports this module (the #import system does not de-duplicate,
// so it would define eval_iridescence twice).
//
// The struct layout below MUST match material_params_table.ts and the inline
// \`MaterialParams\` struct in deferred_lighting.wgsl (20 f32, stride 80).
// Thin-film iridescence (KHR_materials_iridescence) — ported from the glTF
// Sample Viewer, after Belcour & Barla, "A Practical Extension to Microfacet
// Theory for the Modeling of Varying Iridescence" (SIGGRAPH 2017).
//
// \`eval_iridescence\` returns the view-dependent iridescent F0 that replaces the
// base dielectric/metal F0 (the lighting pass mixes it in by iridescenceFactor).
// Depends on PI (from pbr_brdf.wgsl — imported alongside this module).

const IRID_XYZ_TO_REC709 = mat3x3<f32>(
   3.2404542, -0.9692660,  0.0556434,
  -1.5371385,  1.8760108, -0.2040259,
  -0.4985314,  0.0415560,  1.0572252,
);

fn irid_sq(x: f32) -> f32 { return x * x; }

fn irid_fresnel0_to_ior(f0: vec3<f32>) -> vec3<f32> {
  let s = sqrt(f0);
  return (vec3<f32>(1.0) + s) / (vec3<f32>(1.0) - s);
}

fn irid_ior_to_fresnel0_v(transmitted_ior: vec3<f32>, incident_ior: f32) -> vec3<f32> {
  let d = (transmitted_ior - vec3<f32>(incident_ior)) / (transmitted_ior + vec3<f32>(incident_ior));
  return d * d;
}

fn irid_ior_to_fresnel0(transmitted_ior: f32, incident_ior: f32) -> f32 {
  return irid_sq((transmitted_ior - incident_ior) / (transmitted_ior + incident_ior));
}

// Fresnel-Schlick with F90 = 1 (scalar + vec3).
fn irid_fschlick(f0: f32, cos_theta: f32) -> f32 {
  let x = clamp(1.0 - cos_theta, 0.0, 1.0);
  return f0 + (1.0 - f0) * pow(x, 5.0);
}
fn irid_fschlick3(f0: vec3<f32>, cos_theta: f32) -> vec3<f32> {
  let x = clamp(1.0 - cos_theta, 0.0, 1.0);
  return f0 + (vec3<f32>(1.0) - f0) * pow(x, 5.0);
}

// Evaluate the spectral sensitivity of the eye to an optical path difference,
// approximated by Gaussians fit to the CIE XYZ curves, then to linear Rec.709.
fn irid_eval_sensitivity(opd: f32, shift: vec3<f32>) -> vec3<f32> {
  let phase = 2.0 * PI * opd * 1.0e-9;
  let val   = vec3<f32>(5.4856e-13, 4.4201e-13, 5.2481e-13);
  let pos   = vec3<f32>(1.6810e+06, 1.7953e+06, 2.2084e+06);
  let vari  = vec3<f32>(4.3278e+09, 9.3046e+09, 6.6121e+09);
  var xyz = val * sqrt(2.0 * PI * vari) * cos(pos * phase + shift) * exp(-irid_sq(phase) * vari);
  xyz.x = xyz.x + 9.7470e-14 * sqrt(2.0 * PI * 4.5282e+09)
                * cos(2.2399e+06 * phase + shift.x) * exp(-4.5282e+09 * irid_sq(phase));
  xyz = xyz / 1.0685e-7;
  return IRID_XYZ_TO_REC709 * xyz;
}

fn eval_iridescence(
  outside_ior: f32, eta2: f32, cos_theta1: f32, thickness: f32, base_f0: vec3<f32>,
) -> vec3<f32> {
  // Thin-film IOR fades to the outside medium as thickness → 0 (no film).
  let irid_ior = mix(outside_ior, eta2, smoothstep(0.0, 0.03, thickness));
  let sin_theta2_sq = irid_sq(outside_ior / irid_ior) * (1.0 - irid_sq(cos_theta1));
  let cos_theta2_sq = 1.0 - sin_theta2_sq;
  if (cos_theta2_sq < 0.0) {
    return vec3<f32>(1.0); // total internal reflection
  }
  let cos_theta2 = sqrt(cos_theta2_sq);

  // First interface (medium → film).
  let r0  = irid_ior_to_fresnel0(irid_ior, outside_ior);
  let r12 = irid_fschlick(r0, cos_theta1);
  let t121 = 1.0 - r12;
  var phi12 = 0.0;
  if (irid_ior < outside_ior) { phi12 = PI; }
  let phi21 = PI - phi12;

  // Second interface (film → base).
  let base_ior = irid_fresnel0_to_ior(clamp(base_f0, vec3<f32>(0.0), vec3<f32>(0.9999)));
  let r1  = irid_ior_to_fresnel0_v(base_ior, irid_ior);
  let r23 = irid_fschlick3(r1, cos_theta2);
  var phi23 = vec3<f32>(0.0);
  if (base_ior.x < irid_ior) { phi23.x = PI; }
  if (base_ior.y < irid_ior) { phi23.y = PI; }
  if (base_ior.z < irid_ior) { phi23.z = PI; }

  // Optical path difference and phase.
  let opd = 2.0 * irid_ior * thickness * cos_theta2;
  let phi = vec3<f32>(phi21) + phi23;

  // Airy summation of the reflectance over the two-interface stack.
  let r123  = clamp(r12 * r23, vec3<f32>(1e-5), vec3<f32>(0.9999));
  let r123s = sqrt(r123);
  let rs    = irid_sq(t121) * r23 / (vec3<f32>(1.0) - r123);

  var I  = vec3<f32>(r12) + rs;
  var cm = rs - vec3<f32>(t121);
  for (var m = 1; m <= 2; m = m + 1) {
    cm = cm * r123s;
    let sm = 2.0 * irid_eval_sensitivity(f32(m) * opd, f32(m) * phi);
    I = I + cm * sm;
  }
  return max(I, vec3<f32>(0.0));
}

// Subsurface forward-scatter tuning (engine model). DISTORTION bends the
// transmission half-vector toward N; POWER sharpens the view-dependent glow.
const SSS_DISTORTION : f32 = 0.2;
const SSS_POWER      : f32 = 4.0;

// Extended per-material params, indexed by the material id carried in the
// G-buffer's \`material_data.a\` (deferred / point-spot) or the material uniform's
// \`materialId\` (forward / forward+). The importing shader declares the binding:
//   @group(_) @binding(_) var<storage, read> materialParams : array<MaterialParams>;
struct MaterialParams {
  specularColor             : vec3<f32>,
  clearcoatFactor           : f32,
  clearcoatRoughness        : f32,
  sheenRoughness            : f32,
  iridescenceFactor         : f32,
  iridescenceIor            : f32,
  sheenColor                : vec3<f32>,
  iridescenceThickness      : f32,
  diffuseTransmissionColor  : vec3<f32>,
  diffuseTransmissionFactor : f32,
  subsurfaceColor           : vec3<f32>,   // engine subsurface tint (offset 64)
  subsurface                : f32,         // subsurface strength (0 = off)
}

// KHR_materials_iridescence: thin-film interference shifts the base F0 by view
// angle + film thickness. Returns base_F0 unchanged when iridescenceFactor is 0.
fn iridescent_f0(base_F0: vec3<f32>, NdotV: f32, mp: MaterialParams) -> vec3<f32> {
  if (mp.iridescenceFactor <= 0.0) {
    return base_F0;
  }
  let irid = eval_iridescence(1.0, mp.iridescenceIor, NdotV, mp.iridescenceThickness, base_F0);
  return mix(base_F0, irid, mp.iridescenceFactor);
}

// Full direct (punctual / sun) outgoing radiance for one light: base
// Cook-Torrance lobe + clearcoat + sheen + back-lit diffuse transmission. Mirrors
// the deferred path's direct terms.
//
// \`radiance\` folds in light color·intensity·attenuation·shadow for the
// reflective lobes (base / clearcoat / sheen). \`radiance_trans\` is the same
// quantity for the transmission lobe — callers pass it UN-shadowed for the
// directional sun (a front-face shadow must not kill back-lit translucency,
// matching the deferred path), and equal to \`radiance\` for punctual lights
// (whose visibility is geometric — cone / cookie / range — and does gate the
// transmitted light).
// \`aniso_dir\` is the world-space anisotropy tangent (KHR_materials_anisotropy);
// \`anisotropy\` its strength (0 → isotropic, the base lobe stays GGX). When
// non-zero the base D/V become direction-dependent (the bitangent is derived
// from N here). The extension lobes (clearcoat / sheen / transmission) stay
// isotropic. Matches the deferred path's inline anisotropic base lobe.
fn shade_direct_ext(
  N: vec3<f32>, V: vec3<f32>, L: vec3<f32>,
  NdotV: f32, roughness: f32, metallic: f32,
  F0: vec3<f32>, albedo: vec3<f32>, env_brdf: vec2<f32>,
  radiance: vec3<f32>, radiance_trans: vec3<f32>, mp: MaterialParams,
  aniso_dir: vec3<f32>, anisotropy: f32,
) -> vec3<f32> {
  let NdotL = max(dot(N, L), 0.0);
  let H     = normalize(L + V);
  let NdotH = max(dot(N, H), 0.0);
  let VdotH = max(dot(V, H), 0.0);

  let Ecomp = energy_compensation(F0, env_brdf);
  let F     = fresnel_schlick(VdotH, F0);
  // Base GGX lobe — anisotropic when the surface carries an anisotropy strength.
  var D: f32;
  var Vis: f32;
  if (abs(anisotropy) > 0.001) {
    let aT = normalize(aniso_dir - N * dot(aniso_dir, N));
    let aB = cross(N, aT);
    let aa = aniso_alphas(roughness, anisotropy);
    D   = distribution_ggx_aniso(NdotH, dot(aT, H), dot(aB, H), aa.x, aa.y);
    Vis = visibility_smith_ggx_aniso(NdotV, NdotL,
            dot(aT, V), dot(aB, V), dot(aT, L), dot(aB, L), aa.x, aa.y);
  } else {
    D   = distribution_ggx(NdotH, roughness);
    Vis = visibility_smith_ggx(NdotV, NdotL, roughness);
  }
  var spec  = D * Vis * F * Ecomp;
  let kD    = (vec3<f32>(1.0) - F) * (1.0 - metallic);
  var diff  = kD * albedo / PI;

  // Clearcoat: a second colorless dielectric lobe (F0 0.04) over the base, with
  // its own roughness, sharing the base normal. The base passes through the coat,
  // so it is attenuated by (1 − F_coat). clearcoatFactor 0 → skipped (no coat).
  if (mp.clearcoatFactor > 0.0) {
    let cc_rough = max(mp.clearcoatRoughness, 0.04);
    let Fcc = fresnel_schlick(VdotH, vec3<f32>(0.04)).x * mp.clearcoatFactor;
    let Dcc = distribution_ggx(NdotH, cc_rough);
    let Vcc = visibility_smith_ggx(NdotV, NdotL, cc_rough);
    diff = diff * (1.0 - Fcc);
    spec = spec * (1.0 - Fcc) + vec3<f32>(Dcc * Vcc * Fcc);
  }

  var out_rad = (diff + spec) * radiance * NdotL;

  // Sheen (KHR_materials_sheen): a soft retroreflective fabric lobe — Charlie
  // distribution (Estevez-Kulla) + Ashikhmin visibility. sheenColor 0 → skipped.
  let sheen = mp.sheenColor;
  if (sheen.r + sheen.g + sheen.b > 0.0) {
    let sheen_rough = max(mp.sheenRoughness, 0.07);
    let inv_a   = 1.0 / sheen_rough;
    let sin_h2  = max(1.0 - NdotH * NdotH, 0.0);
    let d_charlie = (2.0 + inv_a) * pow(sin_h2, inv_a * 0.5) / (2.0 * PI);
    let v_sheen   = 1.0 / max(4.0 * (NdotL + NdotV - NdotL * NdotV), 1e-4);
    out_rad += sheen * d_charlie * v_sheen * radiance * NdotL;
  }

  // Diffuse transmission (KHR_materials_diffuse_transmission): thin-surface
  // translucency — the far side gathers light when the source is behind the
  // surface (back-side cosine), tinted by the transmission color. factor 0 →
  // skipped. Uses \`radiance_trans\` (see the doc comment).
  if (mp.diffuseTransmissionFactor > 0.0) {
    let back_NdotL = max(-dot(N, L), 0.0);
    out_rad += mp.diffuseTransmissionFactor * mp.diffuseTransmissionColor
             * albedo / PI * back_NdotL * radiance_trans;
  }

  // Subsurface scattering (engine model — no glTF extension): view-dependent
  // forward scatter through thin, backlit geometry (the "glow" on leaves / ears /
  // wax). The transmission half-vector is L bent slightly by N; the term peaks
  // when the eye looks back toward the light through the surface. Uses
  // \`radiance_trans\` (un-shadowed for the sun) so a front shadow doesn't kill the
  // back-lit glow. subsurface 0 → skipped. Complements diffuse transmission (the
  // Lambertian back-gather); a soft front wrap is a follow-up.
  if (mp.subsurface > 0.0) {
    let sss_h = normalize(L + N * SSS_DISTORTION);
    let sss_t = pow(max(dot(V, -sss_h), 0.0), SSS_POWER) * mp.subsurface;
    out_rad += sss_t * mp.subsurfaceColor * radiance_trans;
  }

  return out_rad;
}

// Representative-point area lights (sphere / tube / rect) + the AreaLight struct.
// area_lights.wgsl — representative-point area lights (Karis, "Real Shading in
// Unreal Engine 4", SIGGRAPH 2013). A sphere and a tube (capsule) light produce
// soft, shape-aware specular highlights that a punctual light cannot: the
// highlight grows and softens with the source size, and a tube stretches it.
//
// The "area" character lives in the SPECULAR lobe — the reflection ray is
// pointed at the closest point on the source (the representative point) and the
// NDF is energy-normalized for the source's angular size. Diffuse uses the
// light-center direction with the shared windowed inverse-square falloff. This
// is the table-free approximation; LTC rect lights (which need precomputed
// transform tables) are a separate, heavier path.
//
// Depends on pbr_brdf.wgsl (PI, distribution_ggx, visibility_smith_ggx,
// fresnel_schlick, attenuate_inverse_square) — the importing shader must also
// \`#import "pbr_brdf.wgsl"\`.

// Closest point on a sphere (center \`L\`, relative to the surface point; radius
// \`radius\`) to the reflection ray \`R\`. Returns the point's position relative to
// the surface. When the ray already passes through the sphere this returns a
// point on the ray; otherwise the nearest surface point.
// Maximum area lights a lighting pass uploads + iterates per frame.
const MAX_AREA_LIGHTS: u32 = 8u;

// One element of a lighting pass's area-light storage buffer (64 B / 16 f32) —
// matches AreaLight + packAreaLights in renderer/area_light.ts. Fields are
// interpreted by \`kind\`: 0 sphere, 1 tube, 2 rect.
struct AreaLight {
  position  : vec3<f32>,
  kind      : f32,
  color     : vec3<f32>,
  intensity : f32,
  axisHalf  : vec3<f32>,   // tube: half (p1−p0); rect: half-width edge vector
  radius    : f32,         // sphere / tube radius
  halfUp    : vec3<f32>,   // rect: half-height edge vector
  range     : f32,
}

// Dispatch one area light to the matching representative-point evaluator. Defined
// here so every lighting path (forward / forward+ / deferred) shares one loop
// body; the importing shader only declares the storage binding + the count loop.
fn shade_area_light(
  al: AreaLight, P: vec3<f32>, N: vec3<f32>, V: vec3<f32>,
  F0: vec3<f32>, albedo: vec3<f32>, roughness: f32, metallic: f32,
) -> vec3<f32> {
  if (al.kind < 0.5) {
    return area_light_sphere(P, N, V, al.position, al.radius,
      F0, albedo, roughness, metallic, al.color, al.intensity, al.range);
  } else if (al.kind < 1.5) {
    return area_light_tube(P, N, V, al.position - al.axisHalf, al.position + al.axisHalf, al.radius,
      F0, albedo, roughness, metallic, al.color, al.intensity, al.range);
  }
  return area_light_rect(P, N, V, al.position, al.axisHalf, al.halfUp,
    F0, albedo, roughness, metallic, al.color, al.intensity, al.range);
}

fn closest_point_on_sphere(L: vec3<f32>, R: vec3<f32>, radius: f32) -> vec3<f32> {
  let center_to_ray = dot(L, R) * R - L;
  return L + center_to_ray * clamp(radius / max(length(center_to_ray), 1e-4), 0.0, 1.0);
}

// NDF energy normalization for a finite-size source. Pointing the reflection ray
// at the representative point effectively widens the specular lobe; rescale by
// (alpha / alpha')² so total reflected energy stays ~constant as the source
// grows (Karis). \`dist\` is the distance to the representative point.
fn area_ndf_normalization(roughness: f32, radius: f32, dist: f32) -> f32 {
  let a  = roughness * roughness;
  let aP = clamp(a + radius / (2.0 * max(dist, 1e-4)), 0.0, 1.0);
  let n  = a / max(aP, 1e-4);
  return n * n;
}

// Cook-Torrance specular for a representative point at relative position \`rp\`,
// energy-normalized for a source of the given \`radius\`.
fn area_specular(
  N: vec3<f32>, V: vec3<f32>, rp: vec3<f32>, radius: f32,
  roughness: f32, F0: vec3<f32>,
) -> vec3<f32> {
  let dist  = max(length(rp), 1e-4);
  let L     = rp / dist;
  let H     = normalize(V + L);
  let NdotL = max(dot(N, L), 0.0);
  let NdotV = max(dot(N, V), 1e-4);
  let NdotH = max(dot(N, H), 0.0);
  let VdotH = max(dot(V, H), 0.0);
  let D   = distribution_ggx(NdotH, roughness) * area_ndf_normalization(roughness, radius, dist);
  let Vis = visibility_smith_ggx(NdotV, NdotL, roughness);
  let F   = fresnel_schlick(VdotH, F0);
  return D * Vis * F * NdotL;
}

// Outgoing radiance from a SPHERE area light.
//   P, N, V                : surface position, normal, view dir (V toward camera)
//   center, radius         : sphere center (world) and radius
//   F0, albedo, roughness, metallic : BRDF inputs
//   color, intensity, range: radiometry (windowed inverse-square falloff)
fn area_light_sphere(
  P: vec3<f32>, N: vec3<f32>, V: vec3<f32>,
  center: vec3<f32>, radius: f32,
  F0: vec3<f32>, albedo: vec3<f32>, roughness: f32, metallic: f32,
  color: vec3<f32>, intensity: f32, range: f32,
) -> vec3<f32> {
  let L_c  = center - P;
  let dist = length(L_c);
  let L_d  = L_c / max(dist, 1e-4);

  // Specular: representative point on the sphere nearest the reflection ray.
  let R   = reflect(-V, N);
  let rp  = closest_point_on_sphere(L_c, R, radius);
  let spec = area_specular(N, V, rp, radius, roughness, F0);

  // Diffuse: Lambert toward the sphere center.
  let NdotL = max(dot(N, L_d), 0.0);
  let F_c   = fresnel_schlick(max(dot(N, V), 1e-4), F0);
  let kD    = (vec3<f32>(1.0) - F_c) * (1.0 - metallic);
  let diff  = kD * albedo / PI * NdotL;

  let radiance = color * intensity * attenuate_inverse_square(dist, range);
  return (diff + spec) * radiance;
}

// Outgoing radiance from a TUBE (capsule) area light: a segment p0→p1 of radius
// \`radius\`. Specular finds the closest point on the segment to the reflection
// ray, then treats it as a sphere; diffuse uses the closest point on the segment
// to the surface. The result is an elongated, soft highlight aligned with the
// tube (fluorescent-strip / light-sabre look).
fn area_light_tube(
  P: vec3<f32>, N: vec3<f32>, V: vec3<f32>,
  p0: vec3<f32>, p1: vec3<f32>, radius: f32,
  F0: vec3<f32>, albedo: vec3<f32>, roughness: f32, metallic: f32,
  color: vec3<f32>, intensity: f32, range: f32,
) -> vec3<f32> {
  let L0 = p0 - P;
  let L1 = p1 - P;
  let Ld = L1 - L0;
  let len2 = max(dot(Ld, Ld), 1e-4);
  let R  = reflect(-V, N);

  // Specular: parameter t of the point on the segment closest to the ray R
  // (through the origin). Solves the ray/segment closest-approach, clamped to the
  // segment, then refines as a sphere around that point.
  let RoLd = dot(R, Ld);
  let denom = len2 - RoLd * RoLd;
  var t_spec = 0.0;
  if (denom > 1e-4) {
    t_spec = clamp((dot(R, L0) * RoLd - dot(L0, Ld)) / denom, 0.0, 1.0);
  }
  let seg = L0 + Ld * t_spec;
  let rp  = closest_point_on_sphere(seg, R, radius);
  let spec = area_specular(N, V, rp, radius, roughness, F0);

  // Diffuse: closest point on the segment to the surface point (origin), giving a
  // stable direction + distance for the Lambert term.
  let t_diff = clamp(-dot(L0, Ld) / len2, 0.0, 1.0);
  let d_seg  = L0 + Ld * t_diff;
  let dist   = max(length(d_seg), 1e-4);
  let L_d    = d_seg / dist;
  let NdotL  = max(dot(N, L_d), 0.0);
  let F_c    = fresnel_schlick(max(dot(N, V), 1e-4), F0);
  let kD     = (vec3<f32>(1.0) - F_c) * (1.0 - metallic);
  let diff   = kD * albedo / PI * NdotL;

  let radiance = color * intensity * attenuate_inverse_square(dist, range);
  return (diff + spec) * radiance;
}

// Outgoing radiance from a RECTANGLE (quad / plane) area light, one-sided.
//   center      : rect center (world)
//   ex, ey      : the rect's half-extent vectors (world): ex spans half its width
//                 along its local right axis, ey half its height along local up.
//                 The emission normal is normalize(cross(ex, ey)); the light only
//                 lights surfaces on that side.
// Specular: intersect the reflection ray with the rect plane and clamp the hit to
// the rect bounds → representative point (falls back to the center when the ray
// misses the plane). Diffuse: closest point on the rect to the surface (clamped
// projection) → a stable Lambert direction. Table-free (the LTC alternative —
// reference-quality rect specular — is described in TODO/ltc-area-lights.md).
fn area_light_rect(
  P: vec3<f32>, N: vec3<f32>, V: vec3<f32>,
  center: vec3<f32>, ex: vec3<f32>, ey: vec3<f32>,
  F0: vec3<f32>, albedo: vec3<f32>, roughness: f32, metallic: f32,
  color: vec3<f32>, intensity: f32, range: f32,
) -> vec3<f32> {
  let halfW = max(length(ex), 1e-4);
  let halfH = max(length(ey), 1e-4);
  let rxn = ex / halfW;
  let ryn = ey / halfH;
  let Ln  = normalize(cross(ex, ey));

  // One-sided: only surfaces in front of the panel (on the side Ln faces) are lit.
  let toCenter = center - P;
  if (dot(-toCenter, Ln) <= 0.0) {
    return vec3<f32>(0.0);
  }

  // Specular: reflection ray ∩ rect plane, clamped to the rect's extents.
  let R = reflect(-V, N);
  var rp = toCenter;                       // fallback: aim at the center
  let denom = dot(R, Ln);
  if (abs(denom) > 1e-4) {
    let t = dot(toCenter, Ln) / denom;     // ray P + t·R hits the plane
    if (t > 0.0) {
      let hit = R * t - toCenter;          // hit point relative to the center
      let u = clamp(dot(hit, rxn), -halfW, halfW);
      let v = clamp(dot(hit, ryn), -halfH, halfH);
      rp = toCenter + rxn * u + ryn * v;   // representative point relative to P
    }
  }
  // Use the smaller half-extent as the effective source size for NDF widening.
  let spec = area_specular(N, V, rp, min(halfW, halfH), roughness, F0);

  // Diffuse: closest point on the rect to the surface point (clamped projection).
  let d0 = -toCenter;                      // P - center, in world
  let du = clamp(dot(d0, rxn), -halfW, halfW);
  let dv = clamp(dot(d0, ryn), -halfH, halfH);
  let dpos = toCenter + rxn * du + ryn * dv;
  let dist = max(length(dpos), 1e-4);
  let L_d  = dpos / dist;
  let NdotL = max(dot(N, L_d), 0.0);
  let F_c   = fresnel_schlick(max(dot(N, V), 1e-4), F0);
  let kD    = (vec3<f32>(1.0) - F_c) * (1.0 - metallic);
  let diff  = kD * albedo / PI * NdotL;

  let radiance = color * intensity * attenuate_inverse_square(dist, range);
  return (diff + spec) * radiance;
}

// Maximum lights supported
const MAX_POINT_LIGHTS: u32 = 8u;
const MAX_SPOT_LIGHTS: u32 = 4u;

struct CameraUniforms {
  view        : mat4x4<f32>,
  proj        : mat4x4<f32>,
  viewProj    : mat4x4<f32>,
  invViewProj : mat4x4<f32>,
  position    : vec3<f32>,
  near        : f32,
  far         : f32,
}

struct ModelUniforms {
  model        : mat4x4<f32>,
  normalMatrix : mat4x4<f32>,
}

struct MaterialUniforms {
  albedo         : vec4<f32>,
  emissiveFactor : vec3<f32>,
  roughness      : f32,
  metallic       : f32,
  specular       : f32,
  uvOffset       : vec2<f32>,
  uvScale        : vec2<f32>,
  uvTile         : vec2<f32>,
  alphaCutoff    : f32,          // MASK alpha-test threshold (0 = no test)
  normalScale    : f32,          // normalTexture.scale
  shadingModelId : f32,          // 0 = DefaultLit, 1 = Unlit
  materialId     : f32,          // index into MaterialParams SSBO
  specularColor  : vec3<f32>,    // KHR_materials_specular color tint
  uvRotation     : f32,          // UV rotation in radians (KHR_texture_transform)
  anisotropyStrength : f32,      // KHR_materials_anisotropy strength (0 = isotropic)
  anisotropyRotation : f32,      // anisotropy direction angle (radians)
  _pad_aniso     : vec2<f32>,    // → struct rounds to 112 bytes
}

struct PointLight {
  position    : vec3<f32>,
  range       : f32,
  color       : vec3<f32>,
  intensity   : f32,
  castShadows : u32,
  _pad        : vec3<u32>,
}

struct SpotLight {
  position        : vec3<f32>,
  range           : f32,
  direction       : vec3<f32>,
  innerAngle      : f32,
  color           : vec3<f32>,
  outerAngle      : f32,
  intensity       : f32,
  castShadows     : u32,
  shadowMapIndex  : u32,
  _pad            : u32,
  lightViewProj   : mat4x4<f32>,
}

struct DirectionalLight {
  direction       : vec3<f32>,
  intensity       : f32,
  color           : vec3<f32>,
  castShadows     : u32,
  cascadeCount    : u32,
  _pad0           : u32,
  _pad1           : u32,
  lightViewProj0  : mat4x4<f32>,
  splitFar0       : f32,
  _pad_c0         : f32,
  _pad_c0b        : vec2<f32>,
  lightViewProj1  : mat4x4<f32>,
  splitFar1       : f32,
  _pad_c1         : f32,
  _pad_c1b        : vec2<f32>,
  lightViewProj2  : mat4x4<f32>,
  splitFar2       : f32,
  _pad_c2         : f32,
  _pad_c2b        : vec2<f32>,
  lightViewProj3  : mat4x4<f32>,
  splitFar3       : f32,
  _pad_c3         : f32,
  _pad_c3b        : vec2<f32>,
}

struct LightingUniforms {
  numPointLights : u32,
  numSpotLights  : u32,
  iblIntensity   : f32,        // ambient-IBL multiplier (1 = full; host lowers it at night)
  numAreaLights  : u32,        // representative-point area lights (was _pad)
}

// Group 0: Camera
@group(0) @binding(0) var<uniform> camera : CameraUniforms;

// Group 1: Model (or per-instance transforms when HAS_INSTANCING is defined).
@group(1) @binding(0) var<uniform> model    : ModelUniforms;

// Group 2: Material (uniforms + texture maps + sampler)
@group(2) @binding(0) var<uniform> material : MaterialUniforms;
// Normal and MER maps are always bound. Materials without a real map are
// supplied a 1×1 default by PbrMaterial — see _getDefaultNormalView /
// _getDefaultMerView. This eliminates two variant-mask bits at the cost of one
// texture sample per pixel for plain materials.
@group(2) @binding(2) var normal_map   : texture_2d<f32>;
@group(2) @binding(3) var mer_map      : texture_2d<f32>;
@group(2) @binding(4) var mat_sampler  : sampler;
@group(2) @binding(5) var emissive_map : texture_2d<f32>;
// Packed extension-scalar map (R=clearcoat, G=clearcoat roughness, B=sheen
// roughness, A=iridescence — each a per-pixel MULTIPLIER) and the anisotropy
// direction/strength map. Both always bound (1×1 identity defaults supplied by
// PbrMaterial), mirroring the deferred path's loc4 / loc5 G-buffer channels.
@group(2) @binding(6) var ext_map        : texture_2d<f32>;
@group(2) @binding(7) var anisotropy_map : texture_2d<f32>;

// Group 3: Lighting + Shadow + IBL
@group(3) @binding(0) var<uniform> lighting            : LightingUniforms;
@group(3) @binding(1) var<uniform> directionalLight    : DirectionalLight;
@group(3) @binding(2) var<storage, read> pointLights   : array<PointLight>;
@group(3) @binding(3) var<storage, read> spotLights    : array<SpotLight>;
@group(3) @binding(4) var shadowMapArray     : texture_depth_2d_array;
@group(3) @binding(5) var shadowSampler      : sampler_comparison;
@group(3) @binding(6) var irradiance_cube    : texture_cube<f32>;
@group(3) @binding(7) var prefilter_cube     : texture_cube<f32>;
@group(3) @binding(8) var brdf_lut           : texture_2d<f32>;
@group(3) @binding(9) var ibl_sampler        : sampler;
@group(3) @binding(10) var pointShadowCubeArray : texture_depth_cube_array;
// Extended per-material params (clearcoat / sheen / iridescence / diffuse
// transmission), indexed by \`material.materialId\`. Struct in pbr_extensions.wgsl.
@group(3) @binding(11) var<storage, read> materialParams : array<MaterialParams>;
// Representative-point area lights (sphere / tube / rect). Count in lighting.numAreaLights.
@group(3) @binding(12) var<storage, read> areaLights : array<AreaLight>;

const IBL_MIP_LEVELS: f32 = 5.0;
const SHADOW_MAP_SIZE: f32 = 2048.0;

// Vertex input/output
struct VertexInput {
  @location(0) position : vec3<f32>,
  @location(1) normal   : vec3<f32>,
  @location(2) uv       : vec2<f32>,
  @location(3) tangent  : vec4<f32>,
}

struct VertexOutput {
  @builtin(position) clip_pos   : vec4<f32>,
  @location(0)       world_pos  : vec3<f32>,
  @location(1)       world_norm : vec3<f32>,
  @location(2)       uv         : vec2<f32>,
  @location(3)       world_tan  : vec4<f32>,
  @location(4)       color_tint : vec4<f32>,  // per-instance albedo/alpha modulator (1.0 in non-instanced path)
  @location(5)       vert_color : vec4<f32>,  // per-vertex COLOR_0 (1.0 when the mesh has none)
}

@vertex
fn vs_main(
  vin: VertexInput,
) -> VertexOutput {
  let world_pos  = model.model * vec4<f32>(vin.position, 1.0);
  let world_norm = normalize((model.normalMatrix * vec4<f32>(vin.normal,      0.0)).xyz);
  let world_tan  = normalize((model.normalMatrix * vec4<f32>(vin.tangent.xyz, 0.0)).xyz);
  let tint       = vec4<f32>(1.0);

  var out: VertexOutput;
  out.clip_pos   = camera.viewProj * world_pos;
  out.world_pos  = world_pos.xyz;
  out.world_norm = world_norm;
  out.uv         = vin.uv;
  out.world_tan  = vec4<f32>(world_tan, vin.tangent.w);
  out.color_tint = tint;
  out.vert_color = vec4<f32>(1.0);
  return out;
}

// PBR BRDF math (distribution_ggx, visibility_smith_ggx, fresnel_schlick,
// fresnel_schlick_roughness, energy_compensation, attenuate_inverse_square) is
// provided by the imported pbr_brdf.wgsl module.

fn cascade_lvp(index: u32) -> mat4x4<f32> {
  if (index == 0u) { return directionalLight.lightViewProj0; }
  if (index == 1u) { return directionalLight.lightViewProj1; }
  if (index == 2u) { return directionalLight.lightViewProj2; }
  return directionalLight.lightViewProj3;
}

fn cascade_split(index: u32) -> f32 {
  if (index == 0u) { return directionalLight.splitFar0; }
  if (index == 1u) { return directionalLight.splitFar1; }
  if (index == 2u) { return directionalLight.splitFar2; }
  return directionalLight.splitFar3;
}

fn select_cascade(view_depth: f32) -> u32 {
  var cascade_index = directionalLight.cascadeCount - 1u;
  for (var i = 0u; i < directionalLight.cascadeCount; i++) {
    if (view_depth <= cascade_split(i)) {
      cascade_index = i;
      break;
    }
  }
  return cascade_index;
}

// Shadow sampling for directional light with cascade selection
fn sample_shadow(world_pos: vec3<f32>) -> f32 {
  if (directionalLight.castShadows == 0u) {
    return 1.0;
  }

  // Compute view-space depth for cascade selection
  let view_pos = camera.view * vec4<f32>(world_pos, 1.0);
  let view_depth = -view_pos.z;

  let cascade_index = select_cascade(view_depth);

  let lightVP = cascade_lvp(cascade_index);
  let light_space = lightVP * vec4<f32>(world_pos, 1.0);
  var shadow_coord = light_space.xyz / light_space.w;
  shadow_coord = vec3<f32>(shadow_coord.xy * 0.5 + 0.5, shadow_coord.z);
  shadow_coord.y = 1.0 - shadow_coord.y;

  if (shadow_coord.x < 0.0 || shadow_coord.x > 1.0 ||
      shadow_coord.y < 0.0 || shadow_coord.y > 1.0 ||
      shadow_coord.z < 0.0 || shadow_coord.z > 1.0) {
    return 1.0;
  }

  let bias = 0.001;
  let arrayIndex = i32(cascade_index);
  let texelSize = 1.0 / SHADOW_MAP_SIZE;
  let offsets = array<vec2<f32>, 4>(
    vec2<f32>(-0.5, -0.5) * texelSize,
    vec2<f32>( 0.5, -0.5) * texelSize,
    vec2<f32>(-0.5,  0.5) * texelSize,
    vec2<f32>( 0.5,  0.5) * texelSize,
  );
  var shadow = 0.0;
  for (var i = 0u; i < 4u; i++) {
    shadow += textureSampleCompareLevel(shadowMapArray, shadowSampler, shadow_coord.xy + offsets[i], arrayIndex, shadow_coord.z - bias);
  }
  return shadow * 0.25;
}

// Shadow sampling for spot light
fn sample_spot_shadow(world_pos: vec3<f32>, light: SpotLight) -> f32 {
  if (light.castShadows == 0u) {
    return 1.0;
  }

  let light_space = light.lightViewProj * vec4<f32>(world_pos, 1.0);
  var shadow_coord = light_space.xyz / light_space.w;
  shadow_coord = vec3<f32>(shadow_coord.xy * 0.5 + 0.5, shadow_coord.z);
  shadow_coord.y = 1.0 - shadow_coord.y;

  if (shadow_coord.x < 0.0 || shadow_coord.x > 1.0 ||
      shadow_coord.y < 0.0 || shadow_coord.y > 1.0 ||
      shadow_coord.z < 0.0 || shadow_coord.z > 1.0) {
    return 1.0;
  }

  let bias = 0.002;
  let arrayIndex = i32(light.shadowMapIndex);
  return textureSampleCompareLevel(shadowMapArray, shadowSampler, shadow_coord.xy, arrayIndex, shadow_coord.z - bias);
}

// Shadow sampling for point light (cube array, linear normalized depth)
fn sample_point_shadow(world_pos: vec3<f32>, light: PointLight, slot: i32) -> f32 {
  if (light.castShadows == 0u) {
    return 1.0;
  }

  let to_frag = world_pos - light.position;
  let dist = length(to_frag);
  if (dist >= light.range) {
    return 1.0;
  }

  let dir = to_frag / dist;
  let compare = dist / light.range;
  let bias = 0.005;
  return textureSampleCompareLevel(pointShadowCubeArray, shadowSampler, dir, slot, compare - bias);
}

// Lighting calculations
fn calculate_pbr_lighting(
  albedo: vec3<f32>,
  N: vec3<f32>,
  V: vec3<f32>,
  world_pos: vec3<f32>,
  roughness: f32,
  metallic: f32,
  occlusion: f32,
  aniso_dir: vec3<f32>,
  anisotropy: f32,
  ext: vec4<f32>,
  n_geom: vec3<f32>,
) -> vec3<f32> {
  let NdotV = max(dot(N, V), 0.001);
  // Extended material params (clearcoat / sheen / iridescence / diffuse
  // transmission), indexed by the material id; id 0 = neutral default.
  var mp = materialParams[u32(material.materialId)];
  // Per-pixel extension multipliers (ext_map): clearcoat · clearcoat roughness ·
  // sheen roughness · iridescence. Identity (1,1,1,1) when untextured. Mirrors
  // the deferred path's loc4 application — must run before F0/iridescence below.
  mp.clearcoatFactor    = mp.clearcoatFactor    * ext.r;
  mp.clearcoatRoughness = mp.clearcoatRoughness * ext.g;
  mp.sheenRoughness     = mp.sheenRoughness     * ext.b;
  mp.iridescenceFactor  = mp.iridescenceFactor  * ext.a;
  let has_dt = mp.diffuseTransmissionFactor > 0.0;
  // Base reflectance: 0.08·specular·specularColor for dielectrics, albedo for
  // metals, then shifted by thin-film iridescence.
  let base_F0 = mix(0.08 * material.specular * material.specularColor, albedo, metallic);
  let F0 = iridescent_f0(base_F0, NdotV, mp);
  // Env-BRDF (split-sum DFG) sampled once. Drives multiple-scattering energy
  // compensation, applied to every direct specular lobe and the IBL specular.
  let env_brdf = textureSampleLevel(brdf_lut, ibl_sampler, vec2<f32>(NdotV, roughness), 0.0).rg;
  let Ecomp    = energy_compensation(F0, env_brdf);

  var Lo = vec3<f32>(0.0);

  // Directional sun. shade_direct_ext folds in the base lobe + clearcoat + sheen
  // + back-lit diffuse transmission. The front shadow modulates the reflective
  // lobes but NOT the transmission lobe (back-lit translucency), matching deferred.
  {
    let L = normalize(-directionalLight.direction);
    let shadow = sample_shadow(world_pos);
    let radiance = directionalLight.color * directionalLight.intensity;
    Lo += shade_direct_ext(N, V, L, NdotV, roughness, metallic, F0, albedo, env_brdf,
                           radiance * shadow, radiance, mp, aniso_dir, anisotropy);
  }

  // Point lights
  for (var i = 0u; i < lighting.numPointLights && i < MAX_POINT_LIGHTS; i++) {
    let light = pointLights[i];
    let L = light.position - world_pos;
    let distance = length(L);
    if (distance >= light.range) { continue; }
    let L_norm = L / distance;
    let NdotL = dot(N, L_norm);
    // Front-facing cull, unless the material transmits (back side lit when NdotL < 0).
    if (NdotL <= 0.0 && !has_dt) { continue; }
    let attenuation = attenuate_inverse_square(distance, light.range);
    let shadow = sample_point_shadow(world_pos, light, i32(i));
    let radiance = light.color * light.intensity * attenuation * shadow;
    Lo += shade_direct_ext(N, V, L_norm, NdotV, roughness, metallic, F0, albedo, env_brdf,
                           radiance, radiance, mp, aniso_dir, anisotropy);
  }

  // Spot lights
  for (var i = 0u; i < lighting.numSpotLights && i < MAX_SPOT_LIGHTS; i++) {
    let light = spotLights[i];
    let L = light.position - world_pos;
    let distance = length(L);
    if (distance >= light.range) { continue; }
    let L_norm = L / distance;
    let spot_dir = normalize(-light.direction);
    let theta = dot(L_norm, spot_dir);
    let inner = cos(light.innerAngle * 0.0174533);
    let outer = cos(light.outerAngle * 0.0174533);
    let epsilon = inner - outer;
    let intensity_factor = clamp((theta - outer) / epsilon, 0.0, 1.0);
    if (intensity_factor <= 0.0) { continue; }
    let NdotL = dot(N, L_norm);
    if (NdotL <= 0.0 && !has_dt) { continue; }
    let attenuation = attenuate_inverse_square(distance, light.range);
    let shadow = sample_spot_shadow(world_pos, light);
    let radiance = light.color * light.intensity * attenuation * intensity_factor * shadow;
    Lo += shade_direct_ext(N, V, L_norm, NdotV, roughness, metallic, F0, albedo, env_brdf,
                           radiance, radiance, mp, aniso_dir, anisotropy);
  }

  // Representative-point area lights (sphere / tube / rect) — base PBR lobe only
  // (no extension lobes / shadows). Soft, shape-aware highlights.
  for (var i = 0u; i < lighting.numAreaLights && i < MAX_AREA_LIGHTS; i++) {
    Lo += shade_area_light(areaLights[i], world_pos, N, V, F0, albedo, roughness, metallic);
  }

  // IBL ambient + the extension IBL terms (clearcoat reflection, sheen glow,
  // back-hemisphere diffuse transmission) — mirrors the deferred path.
  let kS_ibl = fresnel_schlick_roughness(NdotV, F0, roughness);
  let kD_ibl = (vec3<f32>(1.0) - kS_ibl) * (1.0 - metallic);

  let irradiance = textureSampleLevel(irradiance_cube, ibl_sampler, N, 0.0).rgb;
  let diffuse_ibl = irradiance * albedo * kD_ibl;

  let R = reflect(-V, N);
  // Anisotropic IBL: bend the base specular reflection along the bitangent (the
  // clearcoat lobe below keeps the un-bent R).
  let R_spec = anisotropic_reflect(N, V, aniso_dir, anisotropy);
  let prefiltered = textureSampleLevel(prefilter_cube, ibl_sampler, R_spec, roughness * (IBL_MIP_LEVELS - 1.0)).rgb;
  // env_brdf is sampled once at the top of this function; reuse it here. Fade the
  // reflection where it dips below the geometric horizon (forward path has the
  // true geometric normal, so no depth derivation needed).
  let specular_ibl = prefiltered * (kS_ibl * env_brdf.x + env_brdf.y) * Ecomp
                   * specular_horizon_occlusion(R_spec, n_geom);
  var ambient_ibl = diffuse_ibl + specular_ibl;

  // Clearcoat IBL: a colorless coat reflection at coat roughness; the base
  // passes through, attenuated by (1 − F_coat).
  if (mp.clearcoatFactor > 0.0) {
    let cc_rough = max(mp.clearcoatRoughness, 0.04);
    let cc_env = textureSampleLevel(brdf_lut, ibl_sampler, vec2<f32>(NdotV, cc_rough), 0.0).rg;
    let cc_pf  = textureSampleLevel(prefilter_cube, ibl_sampler, R, cc_rough * (IBL_MIP_LEVELS - 1.0)).rgb;
    let Fcc_ibl = fresnel_schlick_roughness(NdotV, vec3<f32>(0.04), cc_rough).x * mp.clearcoatFactor;
    ambient_ibl = ambient_ibl * (1.0 - Fcc_ibl) + cc_pf * (Fcc_ibl * cc_env.x + cc_env.y);
  }
  // Sheen IBL (soft retroreflection of the irradiance — proper sheen-DFG is a follow-up).
  let sheen = mp.sheenColor;
  if (sheen.r + sheen.g + sheen.b > 0.0) {
    ambient_ibl += sheen * irradiance * 0.5;
  }
  // Diffuse-transmission IBL: the back hemisphere's irradiance, tinted.
  if (has_dt) {
    let irr_back = textureSampleLevel(irradiance_cube, ibl_sampler, -N, 0.0).rgb;
    ambient_ibl += mp.diffuseTransmissionFactor * mp.diffuseTransmissionColor * albedo * irr_back;
  }
  // Subsurface back-hemisphere ambient (engine model; matches the deferred path).
  if (mp.subsurface > 0.0) {
    let sss_back = textureSampleLevel(irradiance_cube, ibl_sampler, -N, 0.0).rgb;
    ambient_ibl += mp.subsurface * mp.subsurfaceColor * sss_back;
  }

  // Full split-sum IBL, scaled by \`iblIntensity\` (host fades it at night) and
  // baked occlusion (glTF AO, indirect-only), plus a shared black-floor so this
  // path scales ambient identically to deferred.
  let ambient = ambient_ibl * lighting.iblIntensity * occlusion
              + ambient_floor(albedo, metallic);

  return Lo + ambient;
}

@fragment
fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
  // UV transform: atlas tiling, then KHR_texture_transform rotation, then offset.
  let uv_scaled = fract(in.uv * material.uvTile) * material.uvScale;
  let uv_cos = cos(material.uvRotation);
  let uv_sin = sin(material.uvRotation);
  let atlas_uv = vec2<f32>(uv_scaled.x * uv_cos - uv_scaled.y * uv_sin,
                           uv_scaled.x * uv_sin + uv_scaled.y * uv_cos) + material.uvOffset;

  let albedo = material.albedo.rgb * in.color_tint.rgb * in.vert_color.rgb;
  let alpha = material.albedo.a * in.color_tint.a * in.vert_color.a;

  let mer = textureSample(mer_map, mat_sampler, atlas_uv);
  let base_roughness = max(material.roughness * mer.b, 0.04);
  let metallic = material.metallic * mer.r;
  // Engine MER scalar emission (tinted by albedo) + glTF emissive map (sRGB × factor).
  let em_tex = textureSample(emissive_map, mat_sampler, atlas_uv).rgb;
  let emissive = albedo * mer.g * 2.0 + em_tex * material.emissiveFactor;

  // Build TBN matrix for normal mapping. Default normal map is (0.5, 0.5, 1)
  // which decodes to (0, 0, 1), i.e. no perturbation, so materials without a
  // real normal map still produce the correct geometric normal.
  let N_geom = normalize(in.world_norm);
  let T = normalize(in.world_tan.xyz);
  let T_ortho = normalize(T - N_geom * dot(T, N_geom));
  let B = cross(N_geom, T_ortho) * in.world_tan.w;
  let tbn = mat3x3<f32>(T_ortho, B, N_geom);
  // glTF MASK alpha-test (alphaCutoff 0 never triggers).
  if (material.alphaCutoff > 0.0 && alpha < material.alphaCutoff) {
    discard;
  }
  let n_raw = textureSample(normal_map, mat_sampler, atlas_uv).rgb * 2.0 - 1.0;
  // normalTexture.scale widens/narrows the tangent-space perturbation (XY only).
  let n_ts = vec3<f32>(n_raw.xy * material.normalScale, n_raw.z);
  let N = normalize(tbn * n_ts);
  // Filter roughness against this pixel's normal variance now that N is final.
  let roughness = geometric_specular_aa(base_roughness, N);

  let V = normalize(camera.position - in.world_pos);

  // KHR_materials_unlit: output base color directly, skipping lighting/IBL.
  if (material.shadingModelId > 0.5) {
    return vec4<f32>(albedo, alpha);
  }

  // Per-pixel extension multipliers (clearcoat / sheen / iridescence) — sampled
  // here and threaded into the lighting fn (mirrors the deferred loc4 channel).
  let ext = textureSample(ext_map, mat_sampler, atlas_uv);
  // Anisotropy direction/strength from anisotropyTexture (.rg ×2−1 = tangent-space
  // direction, .b = strength multiplier), rotated by anisotropyRotation and taken

    function setCanvasSize(canvas, width, height) {
        if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
        }
    }

    async function B64ToA(type, length, s) {
        if (Uint8Array.fromBase64) {
            const s2 = s.substr(s.indexOf(",") + 1);
            const b = Uint8Array.fromBase64(s2);
            if (type == "Uint32Array") {
              return new Uint32Array(b.buffer);
            }
            return b;
        }
        const res = await fetch(s);
        const x = new Uint8Array(await res.arrayBuffer());
        if (type == "Uint32Array") {
            return new Uint32Array(x.buffer, 0, x.length/4);
        }
        return new Uint8Array(x.buffer, 0, x.length);
